
<!DOCTYPE html>
<html lang="en">
<head>
    <title>T12-conditionals</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ******************************* -->
    <!-- STYLESHEETS                     -->
    <!-- ******************************* -->
    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" type="image/png" href="./assets/dtec_favicon.png">
</head>

<!-- ******************************* -->
<!-- BODY                            -->
<!-- ******************************* -->
<body>
    <h1>T12-conditionals</h1>
    <p>Open the console (ctrl+shift+j) to see messages.</p>

    <!-- ******************************* -->
    <!-- USER INPUT FORM                 -->
    <!-- ******************************* -->
    <form onsubmit="return false;">

        <label for="nameField">Name:</label>
        <input type="text" id="nameField" placeholder="Name">

        <label for="ageField">Age:</label>
        <input type="number" id="ageField" placeholder="Age">

        <label for="moneyField">Pocket money:</label>
        <input type="number" id="moneyField" placeholder="Pocket money">

        <button onclick="start()">Start</button>
    </form>

    <!-- ******************************* -->
    <!-- OUTPUT AREA                     -->
    <!-- ******************************* -->
    <div id="spaceForJavascriptOutput">
        The output of your script will go here.
    </div>

    <!-- ******************************* -->
    <!-- JAVASCRIPT FILE                 -->
    <!-- ******************************* -->
    <script src="./t12_conditionals.js"></script>

</html>
